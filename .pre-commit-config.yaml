# Pre-commit hooks for security and code quality
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

default_language_version:
  python: python3
  node: "20.11.0"

repos:
  # ==========================================
  # Security - Secret Detection
  # ==========================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
        name: Detect secrets with gitleaks
        entry: gitleaks protect --verbose --redact --staged
        pass_filenames: false
        
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock\.json|yarn\.lock|poetry\.lock|Pipfile\.lock

  # ==========================================
  # Python Security & Quality
  # ==========================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        name: Bandit security linter for Python
        args: ['-ll', '--recursive', '-x', 'tests,venv,node_modules']
        files: \.py$
        
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        name: Format Python code with Black
        language_version: python3
        files: \.py$

  - repo: https://github.com/PyCQA/pylint
    rev: v3.3.2
    hooks:
      - id: pylint
        name: Pylint Python linter
        files: \.py$
        args: ['--disable=C0111,C0103,R0903,R0913,W0212']

  # ==========================================
  # JavaScript/TypeScript Security & Quality
  # ==========================================
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.14.0
    hooks:
      - id: eslint
        name: ESLint JavaScript/TypeScript linter
        files: \.(js|jsx|ts|tsx)$
        types: [file]
        additional_dependencies:
          - eslint@9.14.0
          - eslint-plugin-security@3.0.1
          - '@typescript-eslint/parser@8.11.0'
          - '@typescript-eslint/eslint-plugin@8.11.0'
        args: ['--fix']

  # ==========================================
  # General Security & File Checks
  # ==========================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
        name: Check Python AST
      - id: check-json
        name: Check JSON files
      - id: check-yaml
        name: Check YAML files
      - id: check-toml
        name: Check TOML files
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=5000']
      - id: check-case-conflict
        name: Check for case conflicts
      - id: check-executables-have-shebangs
        name: Check executables have shebangs
      - id: check-symlinks
        name: Check for broken symlinks
      - id: debug-statements
        name: Check for debug statements
      - id: end-of-file-fixer
        name: Fix end of files
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: ['--fix=lf']
      - id: detect-private-key
        name: Detect private keys
      - id: no-commit-to-branch
        name: Prevent commits to protected branches
        args: ['--branch', 'main', '--branch', 'master', '--branch', 'production']

  # ==========================================
  # Dockerfile Security
  # ==========================================
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.0-beta
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles with Hadolint
        entry: hadolint/hadolint:v2.13.0-beta hadolint
        files: Dockerfile.*|.*\.Dockerfile$

  # ==========================================
  # Markdown & Documentation
  # ==========================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ['--fix']
        files: \.(md|markdown)$
        exclude: node_modules|venv|\.git

  # ==========================================
  # Git Commit Message
  # ==========================================
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.30.1
    hooks:
      - id: commitizen
        name: Check commit message format
        stages: [commit-msg]

# Configuration for specific tools
files: |
  (?x)^(
    .*\.(py|js|jsx|ts|tsx|json|yaml|yml|toml|md|sh|bash|Dockerfile)$|
    Dockerfile.*|
    .*\.Dockerfile$
  )$

exclude: |
  (?x)^(
    .*\.min\.(js|css)|
    .*\.bundle\.(js|css)|
    node_modules/|
    venv/|
    \.venv/|
    env/|
    \.env/|
    build/|
    dist/|
    \.git/|
    \.pytest_cache/|
    __pycache__/|
    \.mypy_cache/|
    \.tox/|
    \.coverage|
    htmlcov/|
    \.yarn/|
    \.pnp.*|
    vendor/|
    migrations/|
    .*\.egg-info/|
    package-lock\.json|
    yarn\.lock|
    poetry\.lock|
    Pipfile\.lock
  )$