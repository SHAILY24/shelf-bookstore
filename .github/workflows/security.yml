name: Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run security scan every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ==========================================
  # Secret Detection with Gitleaks
  # ==========================================
  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for better detection

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # Python Security Analysis
  # ==========================================
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    if: contains(github.repository, 'backend') || contains(github.repository, 'python') || contains(github.repository, 'api')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] safety pip-audit

      - name: Run Bandit Security Scan
        run: |
          bandit -r backend/ -f json -o bandit-report.json || true
          bandit -r backend/ -ll --skip B101

      - name: Check for vulnerable dependencies with Safety
        run: |
          if [ -f backend/requirements.txt ]; then
            safety check -r backend/requirements.txt --json || true
          fi

      - name: Run pip-audit
        run: |
          if [ -f backend/requirements.txt ]; then
            pip-audit -r backend/requirements.txt || true
          fi

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-results
          path: bandit-report.json

  # ==========================================
  # JavaScript/React Security Analysis
  # ==========================================
  javascript-security:
    name: JavaScript Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('frontend/yarn.lock') }}

      - name: Install dependencies
        working-directory: ./frontend
        run: yarn install --frozen-lockfile

      - name: Run ESLint Security Plugin
        working-directory: ./frontend
        run: |
          yarn add -D eslint-plugin-security @typescript-eslint/parser @typescript-eslint/eslint-plugin
          npx eslint . --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-report.json || true

      - name: Audit dependencies with Yarn
        working-directory: ./frontend
        run: |
          yarn audit --level moderate || true
          yarn audit --json > yarn-audit.json || true

      - name: Upload ESLint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-results
          path: frontend/eslint-report.json

      - name: Upload Yarn audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yarn-audit-results
          path: frontend/yarn-audit.json

  # ==========================================
  # Container Security (if Dockerfile exists)
  # ==========================================
  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: hashFiles('**/Dockerfile*') != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ==========================================
  # SAST with CodeQL
  # ==========================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'python' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # ==========================================
  # License Compliance Check
  # ==========================================
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check licenses
        uses: fossas/fossa-action@v1
        continue-on-error: true
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

  # ==========================================
  # Security Report Summary
  # ==========================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, python-security, javascript-security]
    if: always()
    steps:
      - name: Security Scan Summary
        run: |
          echo "## Security Scan Complete"
          echo "All security checks have been performed."
          echo "Check individual job results for details."
          echo ""
          echo "### Scan Results:"
          echo "- Secret Detection: ${{ needs.gitleaks.result }}"
          echo "- Python Security: ${{ needs.python-security.result }}"
          echo "- JavaScript Security: ${{ needs.javascript-security.result }}"